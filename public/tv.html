<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F2350">
  <title>PocketParty TV</title>
  <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="tv-body">
  <canvas id="court-canvas" aria-label="Game view"></canvas>

  <div class="tv-toolbar">
    <button id="btn-lobby-back" class="icon-btn hidden" title="Back to lobby" aria-label="Back to lobby">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#i-back"/></svg>
    </button>
    <button id="btn-sound" class="icon-btn" title="Mute" aria-label="Mute" aria-pressed="false">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#i-volume"/></svg>
    </button>
    <button id="btn-fullscreen" class="icon-btn" title="Full screen" aria-label="Full screen">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#i-maximize"/></svg>
    </button>
    <span id="cast-badge" class="cast-chip hidden"></span>
  </div>

  <div id="lobby-overlay" class="tv-overlay">
    <div class="lobby">
      <aside class="lobby-join">
        <div class="label">Scan to join</div>
        <div class="qr-frame">
          <canvas id="qr-canvas" width="210" height="210" aria-label="QR code to join this room"></canvas>
        </div>
        <div class="label">or enter code</div>
        <div id="room-code-display" class="room-code">····</div>
        <div id="join-url-display" class="join-url">Connecting…</div>
        <button id="btn-open-ctrl" class="link-btn" type="button">Open a controller on this computer</button>
      </aside>

      <section class="lobby-main">
        <header class="lobby-head">
          <h1 class="display">Pick a game</h1>
          <div id="player-count-pill" class="lobby-count"><strong>0</strong> of 4 phones</div>
        </header>

        <div class="game-picker" id="game-group">
          <button class="game-tile active" data-game="tennis" aria-pressed="true">
            <svg aria-hidden="true"><use href="/icons.svg#g-tennis"/></svg>
            <span class="game-tile-name">Tennis</span>
            <span class="game-tile-sub">Singles or doubles</span>
          </button>
          <button class="game-tile" data-game="bowling" aria-pressed="false">
            <svg aria-hidden="true"><use href="/icons.svg#g-bowling"/></svg>
            <span class="game-tile-name">Bowling</span>
            <span class="game-tile-sub">Take turns, 1 to 4 bowlers</span>
          </button>
        </div>

        <div id="seats-grid" class="lineup"></div>

        <div class="settings-row">
          <div class="field" id="mode-field">
            <span class="label">Players</span>
            <div class="seg" id="mode-group">
              <button class="seg-btn active" data-mode="singles">Singles</button>
              <button class="seg-btn" data-mode="doubles">Doubles</button>
            </div>
          </div>
          <div class="field" id="format-field">
            <span class="label">Length</span>
            <div class="seg" id="format-group">
              <button class="seg-btn active" data-format="one_game">1 game</button>
              <button class="seg-btn" data-format="best_of_3">Best of 3</button>
              <button class="seg-btn" data-format="best_of_5">Best of 5</button>
            </div>
          </div>
          <div class="field hidden" id="bowling-format-field">
            <span class="label">Frames</span>
            <div class="seg" id="bowling-format-group">
              <button class="seg-btn" data-format="quick_3">3</button>
              <button class="seg-btn active" data-format="classic_5">5</button>
              <button class="seg-btn" data-format="full_10">10</button>
            </div>
          </div>
          <div class="field">
            <span class="label">Computer players</span>
            <div class="seg" id="diff-group">
              <button class="seg-btn" data-diff="rookie">Easy</button>
              <button class="seg-btn active" data-diff="pro">Medium</button>
              <button class="seg-btn" data-diff="champion">Hard</button>
            </div>
          </div>
        </div>

        <footer class="lobby-foot">
          <button id="btn-start-match" class="btn btn-ball">Start match</button>
          <span class="hint">Anyone in the room can start from their phone too.</span>
        </footer>
      </section>
    </div>
  </div>

  <div id="summary-overlay" class="tv-overlay hidden">
    <div class="summary">
      <div id="summary-kicker" class="summary-kicker">Match over</div>
      <h1 id="summary-title" class="display">Blue wins</h1>
      <div id="summary-score" class="summary-score"></div>
      <table class="stats-table">
        <thead id="summary-stats-head"></thead>
        <tbody id="summary-stats-body"></tbody>
      </table>
      <div class="summary-actions">
        <button id="btn-rematch" class="btn btn-ball">Rematch</button>
        <button id="btn-return-lobby" class="btn btn-line">Change players</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/tv-app.js"></script>
</body>
</html>
