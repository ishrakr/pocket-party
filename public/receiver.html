<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketParty Cast receiver</title>
  <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js" async></script>
</head>
<body class="tv-body" data-cast-receiver="true">
  <canvas id="court-canvas" aria-label="Game view"></canvas>

  <div class="tv-toolbar">
    <span id="cast-badge" class="cast-chip">Chromecast</span>
    <button id="btn-sound" class="hidden"></button>
    <button id="btn-fullscreen" class="hidden"></button>
    <button id="btn-lobby-back" class="hidden"></button>
  </div>

  <div id="lobby-overlay" class="tv-overlay">
    <div class="lobby">
      <aside class="lobby-join">
        <div class="label">Scan to join</div>
        <div class="qr-frame">
          <canvas id="qr-canvas" width="210" height="210" aria-label="QR code to join this room"></canvas>
        </div>
        <div class="label">or enter code</div>
        <div id="room-code-display" class="room-code">····</div>
        <div id="join-url-display" class="join-url">Waiting for a phone to cast…</div>
        <button id="btn-open-ctrl" class="hidden"></button>
      </aside>

      <section class="lobby-main">
        <header class="lobby-head">
          <h1 class="display">Pick a game</h1>
          <div id="player-count-pill" class="lobby-count"><strong>0</strong> of 4 phones</div>
        </header>

        <div class="game-picker" id="game-group">
          <button class="game-tile active" data-game="tennis" aria-pressed="true" tabindex="-1">
            <svg aria-hidden="true"><use href="/icons.svg#g-tennis"/></svg>
            <span class="game-tile-name">Tennis</span>
            <span class="game-tile-sub">Singles or doubles</span>
          </button>
          <button class="game-tile" data-game="bowling" aria-pressed="false" tabindex="-1">
            <svg aria-hidden="true"><use href="/icons.svg#g-bowling"/></svg>
            <span class="game-tile-name">Bowling</span>
            <span class="game-tile-sub">Take turns, 1 to 4 bowlers</span>
          </button>
        </div>

        <div id="seats-grid" class="lineup"></div>

        <div class="settings-row">
          <div class="field" id="mode-field">
            <span class="label">Players</span>
            <div class="seg" id="mode-group">
              <button class="seg-btn active" data-mode="singles" tabindex="-1">Singles</button>
              <button class="seg-btn" data-mode="doubles" tabindex="-1">Doubles</button>
            </div>
          </div>
          <div class="field" id="format-field">
            <span class="label">Length</span>
            <div class="seg" id="format-group">
              <button class="seg-btn active" data-format="one_game" tabindex="-1">1 game</button>
              <button class="seg-btn" data-format="best_of_3" tabindex="-1">Best of 3</button>
              <button class="seg-btn" data-format="best_of_5" tabindex="-1">Best of 5</button>
            </div>
          </div>
          <div class="field hidden" id="bowling-format-field">
            <span class="label">Frames</span>
            <div class="seg" id="bowling-format-group">
              <button class="seg-btn" data-format="quick_3" tabindex="-1">3</button>
              <button class="seg-btn active" data-format="classic_5" tabindex="-1">5</button>
              <button class="seg-btn" data-format="full_10" tabindex="-1">10</button>
            </div>
          </div>
          <div class="field">
            <span class="label">Computer players</span>
            <div class="seg" id="diff-group">
              <button class="seg-btn" data-diff="rookie" tabindex="-1">Easy</button>
              <button class="seg-btn active" data-diff="pro" tabindex="-1">Medium</button>
              <button class="seg-btn" data-diff="champion" tabindex="-1">Hard</button>
            </div>
          </div>
        </div>

        <footer class="lobby-foot">
          <span class="hint">Change settings and start the match from any phone in the room.</span>
          <button id="btn-start-match" class="hidden"></button>
        </footer>
      </section>
    </div>
  </div>

  <div id="summary-overlay" class="tv-overlay hidden">
    <div class="summary">
      <div id="summary-kicker" class="summary-kicker">Match over</div>
      <h1 id="summary-title" class="display">Blue wins</h1>
      <div id="summary-score" class="summary-score"></div>
      <table class="stats-table">
        <thead id="summary-stats-head"></thead>
        <tbody id="summary-stats-body"></tbody>
      </table>
      <p class="muted">Tap Rematch on your phone to play again.</p>
      <button id="btn-rematch" class="hidden"></button>
      <button id="btn-return-lobby" class="hidden"></button>
    </div>
  </div>

  <script type="module" src="/js/tv-app.js"></script>
</body>
</html>
